name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Egy ágon egyszerre egy futás elég; egy új push szakítsa félbe a régit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build és tesztek
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A tesztek a TypeScriptet a Node beépített típuseltávolításával
      # futtatják; ez a 22.18-tól alapértelmezett (package.json engines).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the type check so a formatting or lint failure reports in about a
      # second instead of after a full tsc pass. Reuses the install above; a
      # separate job would pay for another npm ci and could extend the wall clock,
      # which the e2e job already owns.
      - name: Lint and formatting
        run: npx biome ci .

      # Két kör: az egész src/ a DOM-mal, és a src/core/ DOM nélkül.
      - name: Típusellenőrzés
        run: npm run check

      - name: Build
        run: npm run build

      # A build után: az analitika-teszt a buildelt dist/index.html-t is nézi.
      - name: Tesztek
        run: npm test

  e2e:
    name: Böngészős tesztek
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium telepítése
        run: npx playwright install --with-deps chromium

      # Buildel, majd a buildelt kimenetet a 5181-es porton teszteli.
      - name: Böngészős tesztek
        run: npm run test:e2e

      - name: Nyomkövetés hibánál
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
