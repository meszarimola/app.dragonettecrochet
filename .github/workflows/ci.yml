name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# One run per ref is enough; a new push cancels the one in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The tests run TypeScript through Node's built-in type stripping,
      # default since 22.18 (see the engines field).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before the type check so a formatting or lint failure reports in about a
      # second instead of after a full tsc pass. Reuses the install above; a
      # separate job would pay for another npm ci and could extend the wall clock,
      # which the e2e job already owns.
      - name: Lint and formatting
        run: npx biome ci .

      # Two passes: all of src/ with the DOM, then src/core/ without it.
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # After the build: the analytics test reads the built dist/index.html.
      - name: Tesztek
        run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Buildel, majd a buildelt kimenetet a 5181-es porton teszteli.
      - name: Browser tests
        run: npm run test:e2e

      - name: Trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
