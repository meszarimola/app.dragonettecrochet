<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mintatervező — Dragonette Crochet</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="bar__group">
          <a
            class="home"
            href="https://dragonettecrochet.com/hu/"
            aria-label="Vissza a dragonettecrochet.com főoldalára"
          >
            <svg class="home__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M3 9.5 10 3.5l7 6" />
              <path d="M4.75 8.5V16h10.5V8.5" />
            </svg>
            <span>Főoldal</span>
          </a>

          <h1 class="bar__title">Mintatervező</h1>
        </div>

        <button
          type="button"
          id="panel-toggle"
          class="bar__toggle"
          aria-expanded="true"
          aria-controls="panel"
        >
          Jelkészlet
        </button>
      </header>

      <main class="stage">
        <canvas id="board"></canvas>

        <aside class="panel" id="panel" aria-label="Jelkészlet">
          <h2 class="panel__title">Alap jelek</h2>
          <p class="panel__hint" id="hint"></p>
          <div class="palette" id="palette"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
