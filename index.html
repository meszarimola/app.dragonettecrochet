<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="docTitle">Free Crochet Pattern Designer & Chart Maker — Dragonette</title>
    <meta
      name="description"
      data-i18n-content="docDescription"
      content="Free crochet pattern designer and chart maker in your browser: symbol charts for rows and rounds, live checking, written patterns, shawls, amigurumi."
    />
    <!-- KB: interface.md §34 -->
    <link rel="canonical" href="https://app.dragonettecrochet.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dragonette Crochet" />
    <meta property="og:url" content="https://app.dragonettecrochet.com/" />
    <meta property="og:title" data-i18n-content="docTitle" content="Free Crochet Pattern Designer & Chart Maker — Dragonette" />
    <meta property="og:description" data-i18n-content="docDescription" content="Free crochet pattern designer and chart maker in your browser: symbol charts for rows and rounds, live checking, written patterns, shawls, amigurumi." />
    <meta property="og:image" content="https://dragonettecrochet.com/img/og-en.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- KB: interface.md §34 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "https://dragonettecrochet.com/#designer",
        "name": "Dragonette Crochet Pattern Designer",
        "alternateName": ["Dragonette Crochet Chart Maker", "Dragonette horgolásminta-tervező"],
        "description": "Free in-browser crochet pattern designer and chart maker: symbol charts for rows and rounds, live checking, written patterns, shawls, amigurumi and filet, with PNG and SVG export.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web browser",
        "url": "https://app.dragonettecrochet.com/",
        "inLanguage": ["hu", "en"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "HUF"
        },
        "publisher": { "@id": "https://dragonettecrochet.com/#organization" },
        "mainEntityOfPage": "https://dragonettecrochet.com/en/crochet-pattern-designer/"
      }
    </script>
    <!-- KB: interface.md §34 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf7f3" />
  </head>
  <body>
    <noscript>
      <div class="noscript" lang="en">
        <h1>Free crochet pattern designer and chart maker</h1>
        <p>The Dragonette Crochet pattern designer runs in your browser: crochet symbol charts for rows and rounds with live checking, written patterns, shawl and amigurumi shapes, filet and other grid techniques, and PNG and SVG export. It needs JavaScript.</p>
        <p><a href="https://dragonettecrochet.com/en/crochet-pattern-designer/">More about the crochet pattern designer</a></p>
      </div>
      <div class="noscript" lang="hu">
        <h2>Ingyenes horgolásminta-tervező és jeldiagram-készítő</h2>
        <p>A Dragonette Crochet mintatervezője a böngészőben fut: horgolásminták jeldiagramja sorokhoz és körökhöz, élő ellenőrzéssel, írott mintával, kendő- és amigurumi-formákkal, filé- és más rácsos technikákkal, PNG és SVG exporttal. A használatához JavaScript kell.</p>
        <p><a href="https://dragonettecrochet.com/hu/horgolasminta-tervezo/">Bővebben a horgolásminta-tervezőről</a></p>
      </div>
    </noscript>
    <div class="app">
      <p class="wip" data-i18n="wipBanner">Work in progress: the designer keeps growing, so do check back later.</p>
      <header class="bar">
        <div class="bar__lead">
          <a
            class="home"
            id="home-link"
            href="https://dragonettecrochet.com/en/"
            aria-label="Back to the dragonettecrochet.com home page"
            data-i18n-label="homeLabel"
          >
            <svg class="home__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M3 9.5 10 3.5l7 6" />
              <path d="M4.75 8.5V16h10.5V8.5" />
            </svg>
            <span data-i18n="homeText">Home</span>
          </a>

          <svg class="brand-mark" viewBox="40 36 120 120" aria-hidden="true" focusable="false">
            <ellipse class="brand-mark__wing" cx="100" cy="92" rx="16" ry="54" transform="rotate(58 100 92)" />
            <ellipse class="brand-mark__wing" cx="100" cy="92" rx="16" ry="54" transform="rotate(122 100 92)" />
            <ellipse class="brand-mark__wing-inner" cx="100" cy="92" rx="9" ry="32" transform="rotate(58 100 92)" />
            <ellipse class="brand-mark__wing-inner" cx="100" cy="92" rx="9" ry="32" transform="rotate(122 100 92)" />
            <ellipse class="brand-mark__body" cx="100" cy="112" rx="5.5" ry="34" />
            <ellipse class="brand-mark__body" cx="100" cy="76" rx="9" ry="16" />
            <circle class="brand-mark__body" cx="100" cy="56" r="9.5" />
            <circle class="brand-mark__eye" cx="96" cy="53" r="2.6" />
            <circle class="brand-mark__eye" cx="104" cy="53" r="2.6" />
          </svg>
          <h1 class="bar__title" data-i18n="barTitle">Pattern designer</h1>
        </div>

        <div class="tools">
          <button type="button" class="tool" id="new-chart" data-tip="New free-form pattern" data-i18n-tip="irregularNewTitle">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M5 2.75h6l4 4V17a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 5 17z" />
              <path d="M11 2.75V7h4" />
              <path d="M10 10v4M8 12h4" />
            </svg>
            <span class="tool__label" data-i18n="toolLabelNew">New</span>
          </button>

          <div class="tools__group">
            <button type="button" class="tool" id="select-tool" aria-pressed="false" data-tip="Select: click a stitch or drag an area; Ctrl/⌘ or Shift + click: several. Drag the selection to move it, the round handle to rotate it, a corner to make it larger or smaller." data-i18n-tip="selectToolTip" disabled>
              <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M5 3.5 15 11l-4.6.9 2.6 4.6-1.8 1-2.6-4.6L5 16z" />
              </svg>
              <span class="tool__label" data-i18n="toolPointerLabel">Select</span>
            </button>
            <button type="button" class="tool" id="duplicate-selection" data-tip="Duplicate the selection (Ctrl/⌘ + D). Ctrl/⌘ + C copies it, Ctrl/⌘ + V pastes it." data-i18n-tip="duplicateTip" aria-keyshortcuts="Control+D Meta+D" disabled>
              <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M5 5h7v7H5z" />
                <path d="M8 8h7v7H8z" />
              </svg>
              <span class="tool__label" data-i18n="toolLabelDuplicate">Duplicate</span>
            </button>
            <button type="button" class="tool" id="delete-selection" data-tip="Delete the selected stitches (Delete)" data-i18n-tip="toolDeleteSelectionTip" aria-keyshortcuts="Delete" disabled>
              <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M5 6h10" />
                <path d="M8 6V4.25h4V6" />
                <path d="M6.5 6l.6 10h5.8l.6-10" />
                <path d="M9 9v4.5M11 9v4.5" />
              </svg>
              <span class="tool__label" data-i18n="toolLabelDeleteSelection">Delete</span>
            </button>
          </div>

          <span class="pickers">
            <select class="picker" id="chart-style" aria-label="Symbol style" data-i18n-label="chartStyleLabel" data-tip="Symbol style" data-i18n-tip="chartStyleLabel">
              <option value="cyc">CYC</option>
              <option value="jis">JIS</option>
            </select>
            <select class="picker" id="ui-language" aria-label="Interface language" data-i18n-label="uiLanguageLabel" data-tip="Interface language" data-i18n-tip="uiLanguageLabel">
              <option value="hu">&#127469;&#127482; HU</option>
              <option value="en">&#127468;&#127463; EN</option>
            </select>
          </span>
        </div>
      </header>

      <main class="stage">
        <aside class="stitches" id="section-stitches" aria-labelledby="stitches-title">
          <h2 class="panel__title" id="stitches-title" data-i18n="sectionStitchesTitle">Stitches</h2>
          <div class="palette" id="palette" role="group" aria-label="Stitches" data-i18n-label="stitchesPaletteLabel"></div>
          <!-- KB: decisions.md §5 -->
          <p class="version" id="version" aria-hidden="true"></p>
        </aside>

        <canvas
          id="board"
          role="img"
          aria-roledescription="free-form crochet chart"
          data-i18n-roledescription="boardIrregularRoleDescription"
          aria-label="Free-form chart: pick a stitch and click the drawing area"
          data-i18n-label="boardIrregularLabel"
          hidden
        ></canvas>
      </main>
    </div>

    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
